html, body {
  height: 100%;
  margin: 0;
}
body {
  background: radial-gradient(900px 520px at 8% -8%,var(--glow),transparent 60%),radial-gradient(700px 420px at 100% 0,rgba(160,107,255,.12),transparent 55%),var(--bg);

  font-size: var(--fs,15px);
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none!important;
}
.center {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 38px 32px;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 24px 70px var(--glow);
}
.logo {
  font-size: 52px;
}
h1 {
  margin: 4px 0 8px;
  font-size: 30px;
  background: linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: -.02em;
}
.mute {
  color: var(--mute);
}
.small {
  font-size: 13px;
}
button {
  font: inherit;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 8px 12px;
  transition: .15s;
}
.btn {
  background: linear-gradient(135deg,var(--acc),var(--acc2));
  color: #fff;
  border-color: var(--acc);
  font-weight: 600;
  border: 0;
  box-shadow: 0 4px 14px var(--glow);
}
.btn.sm {
  padding: 6px 10px;
  font-size: 13px;
}
.ghost:hover {
  background: var(--bot);
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb,var(--card) 70%,transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.sp {
  flex: 1;
}
.main {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
}
aside {
  width: 300px;

  gap: 8px;

  -webkit-backdrop-filter: blur(14px);
}

}
input, textarea {

  background: var(--bg);

  border-radius: 12px;
  padding: 8px 10px;

  outline: none;
}
.doc {
  display: flex;
  align-items: center;

}

}

}

}

}
.bar textarea {

}
.m.bot p {

}
.m.bot li {
  margin: .15em 0;
}
.m.bot code {
  background: var(--card);

}
mjx-container[display="true"] {
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;

}
.ch {
  display: flex;
  align-items: center;
  gap: 4px;
  border-radius: 12px;
  padding: 9px 10px;

}
.ch:hover, .ch.on {

}
.ch span {
  flex: 1;

}
.ch button {

REGLAS:
1. Solo atiendes temas de física. Si el mensaje (o la imagen) NO trata de física, responde EXACTAMENTE con la palabra FUERA_DE_TEMA y nada más. Los saludos sí puedes contestarlos brevemente invitando a hacer una pregunta de física.
2. Explica con rigor universitario: plantea el modelo, define variables, desarrolla paso a paso, da el resultado con unidades y verifica análisis dimensional o límites cuando aporte.
3. Si hay fotos, transcribe lo relevante (enunciado, datos, diagrama) y resuelve.

5. FORMATO (muy importante, la claridad es prioritaria): estructura con títulos cortos en negrita (**Idea clave**, **Desarrollo**, **Resultado**, **Resumen**), pasos numerados y viñetas con "- ", frases cortas y un concepto por paso. Escribe TODA la matemática en LaTeX: en línea entre $...$ (ej. $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$) y las ecuaciones importantes solas en su propia línea entre $$...$$. Nunca uses notación de texto plano como e^(iθ) o √( ). Define cada símbolo la primera vez que aparece. Responde en el idioma del estudiante.`;
const b64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(b); });
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

const plain = t => t.replace(/\$+/g, '').replace(/\\frac/g, 'fracción ').replace(/\\sqrt/g, 'raíz de ').replace(/\\([a-zA-Z]+)/g, '$1 ').replace(/[{}^_\\*#\[\]]/g, ' ');
const OFF = 'Solo puedo ayudarte con temas de física. Prueba con una pregunta, un ejercicio o una foto de tu módulo.';
const ICONS = { hist: '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/>', img: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>', mic: '<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', send: '<path d="M5 12h14M13 6l6 6-6 6"/>', flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>', atom: '<circle cx="12" cy="12" r="1.8"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>' };

const xmlToText = (x, p) => x.replace(new RegExp('</' + p + ':p>', 'g'), '\n').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

const courseCatalog = () => docs.length ? '\n\nTEMARIO DEL CURSO (material cargado por el estudiante; adapta tu forma de explicar, la notación y el nivel a como se enseña aquí; los exámenes muestran el tipo de problemas esperado):\n' + docs.slice(0, 30).map(d => '- [' + (d.kind === 'examen' ? 'Examen' : 'Módulo') + '] ' + d.name + (d.desc ? ': ' + d.desc : '')).join('\n') : '';
const today = () => new Date().toLocaleDateString('en-CA'), yest = () => new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
const saveStreak = () => { try {
    col.doc('s_daily').set(streakState);
}
catch (e) { } };
const currentStreak = () => streakState.last === today() || streakState.last === yest() ? streakState.streak : 0;
const aiErrorText = e => e && e.code === 'access' ? 'Código de acceso incorrecto.' : 'No pude generar las preguntas. Intenta de nuevo.';
const prefsKey = () => 'fbp:' + (me && me.name);
const PALETTES = [['sys', 'Automático', 'linear-gradient(135deg,#f4f5fb 50%,#0b0d1a 50%)'], ['light', 'Claro', 'linear-gradient(135deg,#fff,#eef0fd)'], ['dark', 'Oscuro', 'linear-gradient(135deg,#141830,#0b0d1a)'], ['ocean', 'Océano', 'linear-gradient(135deg,#2fb8ff,#25e0c8)'], ['forest', 'Bosque', 'linear-gradient(135deg,#1f9d55,#59c98a)'], ['sunset', 'Atardecer', 'linear-gradient(135deg,#ff6a3d,#ff3d81)']];

// ==============================================================
// UTILIDADES
// ==============================================================

// Convierte el texto del bot (markdown ligero + LaTeX) en HTML.
function md(t) {
    const M = [], ph = x => '\u0000' + (M.push(x) - 1) + '\u0000';
    t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, x) => ph('\\[' + esc(x) + '\\]')).replace(/\$([^$\n]+?)\$/g, (_, x) => ph('\\(' + esc(x) + '\\)'));
    let h = '', list = '';
    const close = () => { if (list) {
        h += '</' + list + '>';
        list = '';
    } };
    for (const l of esc(t).split('\n')) {
        let m;
        if (m = l.match(/^\s*[-*•]\s+(.*)/)) {
            if (list !== 'ul') {
                close();
                h += '<ul>';
                list = 'ul';
            }
            h += '<li>' + m[1] + '</li>';
        }
        else if (m = l.match(/^\s*(\d+)[.)]\s+(.*)/)) {
            if (list !== 'ol') {
                close();
                h += '<ol>';
                list = 'ol';
            }
            h += '<li value="' + m[1] + '">' + m[2] + '</li>';
        }
        else if (m = l.match(/^#{1,4}\s+(.*)/)) {
            close();
            h += '<h4>' + m[1] + '</h4>';
        }
        else if (l.trim()) {
            close();
            h += '<p>' + l + '</p>';
        }
        else
            close();
    }
    close();
    return h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\u0000(\d+)\u0000/g, (_, i) => M[i]);
}

// Dibuja las fórmulas LaTeX de un elemento con MathJax.
async function typeset(el) { try {
    if (window.MathJax && MathJax.startup) {
        await MathJax.startup.promise;
        await MathJax.typesetPromise([el]);
    }
}
catch (e) { } }

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove('on'), 5000); }

// Huella (hash) de la contraseña; nunca se guarda la contraseña en claro.
async function sha(s) { try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fisicabot|' + s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
catch (e) {
    let h = 0;
    for (const c of 'fisicabot|' + s)
        h = (h * 31 + c.charCodeAt(0)) | 0;
    return 'x' + h;
} }

function segmented(items, cur, on) { const d = document.createElement('div'); d.className = 'seg'; items.forEach(([v, t]) => { const b = document.createElement('button'); b.textContent = t; b.className = String(cur) === String(v) ? 'on' : ''; b.onclick = () => on(v); d.append(b); }); return d; }

// ==============================================================

// Almacén por usuario sobre localStorage (misma forma que una colección).
function mkCol(u) {

        async get() { const o = []; for (let i = 0; i < localStorage.length; i++) {

                    o.push({ id: k.slice(P.length), data: () => v });

                catch (e) { }
            }
        } return { docs: o }; },
        doc: id => ({ async set(v) { localStorage.setItem(P + id, JSON.stringify(v)); }, async delete() { localStorage.removeItem(P + id); } })
    };
}

// Entra a la app: elige motor de IA, carga preferencias, material e historial.

}
catch (e) { } applyPrefs(); }

}
catch (e) { } }

// Panel derecho de perfil: voz, apariencia y cuenta.
async function renderProf() {

// ==============================================================
// MOTOR DE IA (Claude integrado o API key propia)
// ==============================================================

// Envía un prompt al modelo (con imágenes opcionales) y devuelve el texto.
async function ask(input, pics, onText) {
    input = input.replace('\n\nMENSAJE ACTUAL', courseCatalog() + '\n\nMENSAJE ACTUAL');
    if (sample)
        return (await sample(input, { cache: false, modelTier: 'complex', images: pics.length ? pics : undefined, onText })).text;
    const images = await Promise.all(pics.map(b64));
    for (let intento = 0; intento < 2; intento++) {
        const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json', 'x-access-code': localStorage.getItem('fb_code') || '' }, body: JSON.stringify({ input, images }) });
        if (r.status === 401) {
            localStorage.removeItem('fb_code');
            if (intento === 1)
                throw { code: 'access' };
            const c = prompt('Código de acceso:');
            if (!c)
                throw { code: 'access' };
            localStorage.setItem('fb_code', c.trim());
            continue;
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok)
            throw { code: 'server', message: j.detail || j.error };
        return j.text;
    }
}

// Busca en el material los fragmentos que comparten palabras con la pregunta.
function retrieve(q) {
    const w = [...new Set(norm(q).match(/[a-z0-9]{4,}/g) || [])];
    if (!w.length)
        return [];
    const sc = [];
    docs.forEach(d => { for (let i = 0; i < d.text.length; i += 1400) {
        const c = d.text.slice(i, i + 1400), n = norm(c);
        let s = 0;
        w.forEach(x => { if (n.includes(x))
            s++; });
        if (s > 1)
            sc.push({ s, n: kindLabel(d) + d.name, c });
    } });
    return sc.sort((a, b) => b.s - a.s).slice(0, 4);
}

// Pide al modelo preguntas de opción múltiple en JSON, basadas en el material.
async function genQs(n) {
    const src = pickSource(), ex = docs.some(d => d.kind === 'examen');
    const p = 'Eres un generador de preguntas de física universitaria. Crea ' + n + ' pregunta(s) de opción múltiple con 4 opciones y una sola correcta, ' + (src ? 'imitando los temas, la notación, el nivel y el estilo de este material de clase' + (ex ? ' (los exámenes pasados muestran el tipo de problemas que se espera: parécete a ellos)' : '') + ':\n' + src : 'sobre temas variados de física universitaria') + '\n\nResponde SOLO con un arreglo JSON válido, sin markdown ni texto extra: [{"p":"enunciado","o":["a","b","c","d"],"c":0,"e":"explicación breve del procedimiento"}]. "c" es el índice (0 a 3) de la correcta. Escribe la matemática en LaTeX entre $...$ pero usa el símbolo § en lugar de la barra invertida (ej. §frac{a}{b}, §theta). Varía los temas y la posición de la correcta.';
    const raw = await ask(p, []), a = raw.indexOf('['), b = raw.lastIndexOf(']');
    return JSON.parse(raw.slice(a, b + 1).replace(/§/g, '\\\\')).filter(q => q && q.p && Array.isArray(q.o) && q.o.length === 4 && q.c >= 0 && q.c < 4);
}

// Elige al azar fragmentos del material para inspirar las preguntas.
function pickSource() {
    const c = [];
    docs.forEach(d => { for (let i = 0; i < d.text.length; i += 1400)
        c.push({ n: kindLabel(d) + d.name, t: d.text.slice(i, i + 1400) }); });
    const o = [];
    for (let k = 0; k < 5 && c.length; k++)
        o.push(c.splice(Math.floor(Math.random() * c.length), 1)[0]);
    return o.map(x => '[' + x.n + '] ' + x.t).join('\n---\n');
}

// Flujo completo de un mensaje: prompt, respuesta, aviso de “fuera de tema” y guardado.
async function send() {
    if (busy)
        return;
    let text = $('#in').value.trim();
    if (!text && !imgs.length)
        return;

// Saca el texto de un PDF, Word, PowerPoint o texto plano (y la miniatura del PDF).
async function extract(f) {
    const n = f.name.toLowerCase();
    if (n.endsWith('.pdf')) {
        const L = window.pdfjsLib;
        L.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const p = await L.getDocument({ data: await f.arrayBuffer() }).promise;
        let t = '', prev = '';
        for (let i = 1; i <= p.numPages; i++) {
            const pg = await p.getPage(i);
            if (i === 1) {
                try {
                    const v = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 300 / v.width }), c = document.createElement('canvas');
                    c.width = vp.width;
                    c.height = vp.height;
                    await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
                    prev = c.toDataURL('image/jpeg', .6);
                }
                catch (e) { }
            }
            t += (await pg.getTextContent()).items.map(x => x.str).join(' ') + '\n\n';
        }
        return { text: t, prev, ft: 'PDF' };
    }
    if (/\.(docx|pptx)$/.test(n)) {
        const z = await JSZip.loadAsync(await f.arrayBuffer());
        if (n.endsWith('.docx')) {
            const x = z.file('word/document.xml');
            if (!x)
                throw 0;
            return { text: xmlToText(await x.async('string'), 'w'), ft: 'Word' };
        }
        const ks = Object.keys(z.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a, b) => a.match(/\d+/)[0] - b.match(/\d+/)[0]);
        let t = '';
        for (const k of ks)
            t += '[Diapositiva ' + k.match(/\d+/)[0] + ']\n' + xmlToText(await z.file(k).async('string'), 'a') + '\n\n';
        return { text: t, ft: 'PowerPoint' };
    }
    return { text: await f.text(), ft: 'Texto' };
}

// Dictado con el reconocimiento de voz del navegador (respaldo).
function webDict() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR)
        return null;
    const r = new SR(), h = { p: () => { }, f: () => { }, s: () => { } };
    r.lang = 'es-ES';
    r.interimResults = true;
    r.continuous = false;
    r.onstart = () => h.s({ state: 'listening' });
    r.onend = () => h.s({ state: 'idle' });
    r.onerror = e => toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'El navegador bloqueó el micrófono. Permítelo en la barra de direcciones; si abriste el archivo desde tu computadora, usa el enlace publicado o un servidor https.' : e.error === 'no-speech' ? 'No te escuché. Habla más cerca del micrófono e inténtalo otra vez.' : e.error === 'audio-capture' ? 'No encontré un micrófono conectado.' : e.error === 'network' ? 'Sin conexión: el dictado necesita internet.' : 'Error del micrófono: ' + e.error);
    r.onresult = e => { let i = ''; for (let k = e.resultIndex; k < e.results.length; k++) {
        const t = e.results[k][0].transcript;
        if (e.results[k].isFinal)
            h.f({ text: t });
        else
            i += t;
    } h.p({ text: i }); };
    return { start: async () => r.start(), stop: async () => r.stop(), onPartial: f => { h.p = f; }, onFinal: f => { h.f = f; }, onState: f => { h.s = f; } };
}

async function initDict() {
    try {
        dict = await claude.use('dictation');
    }

        dict = null;

    if (!dict)

    $('#bmic').hidden = false;
    dict.onPartial(({ text }) => { $('#in').value = (base + ' ' + text).trim(); });
    dict.onFinal(({ text }) => { base = (base + ' ' + text).trim(); $('#in').value = base; });

            c.width = Math.round(b.width * k);
            c.height = Math.round(b.height * k);
            c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
            const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
            imgs.push(blob);
            const im = document.createElement('img');
            im.src = URL.createObjectURL(blob);
            im.title = 'Toca para quitar';
            im.onclick = () => { imgs = imgs.filter(z => z !== blob); im.remove(); };
            $('#prev').append(im);
        }
        catch (err) {
            add('bot', 'No pude leer esa imagen.');
        }
    }
    e.target.value = '';
};

$('#kseg').onclick = e => { const b = e.target.closest('button'); if (!b)
    return; addKind = b.dataset.k; $('#kseg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
$('#mpick').onclick = () => $('#mf').click();
$('#mf').onchange = e => { pendingFile = e.target.files[0] || null; $('#mfn').textContent = pendingFile ? pendingFile.name : 'PDF, Word (.docx) o PowerPoint (.pptx)'; if (pendingFile && !$('#mn').value)
    $('#mn').value = pendingFile.name.replace(/\.[^.]+$/, ''); };
$('#madd').onclick = async () => {
    const m = $('#mmsg');
    let text = $('#mtext').value, prev = '', ft = 'Texto';
    try {
        if (pendingFile) {
            if (/\.(doc|ppt)$/i.test(pendingFile.name)) {
                m.textContent = 'Guarda el archivo como .docx o .pptx e inténtalo de nuevo.';
                return;
            }
            m.textContent = 'Leyendo ' + pendingFile.name + '…';
            const r = await extract(pendingFile);
            text = r.text;
            prev = r.prev || '';
            ft = r.ft;
        }
        text = (text || '').trim();
        if (!text) {
            m.textContent = 'No encontré texto (¿PDF escaneado?). Prueba con otro formato o pega el texto.';
            return;
        }
        await saveDoc({ name: $('#mn').value.trim() || (pendingFile ? pendingFile.name.replace(/\.[^.]+$/, '') : 'Sin nombre'), desc: $('#mdesc').value.trim(), kind: addKind, text, prev, ft });
    }
    catch (e) {
        m.textContent = 'No pude leer ese archivo.';
    }
};
